# Regrows the bonsai every Monday from public GitHub activity.
name: bonsai
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: Fetch the whole history again, after repos change visibility
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bonsai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the v0.6.0 commit: the action runs with write access to this repo.
      - uses: StevenBtw/gitbonsai@61c48457fc3c34fc45f65e7bd5396fcb4076795a # v0.6.0
        id: bonsai
        with:
          output-dir: assets
          full: ${{ inputs.full || false }}

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.bonsai.outputs.light }}" "${{ steps.bonsai.outputs.dark }}" \
            "${{ steps.bonsai.outputs.snapshot }}"
          git diff --cached --quiet || git commit -m "Grow bonsai"
          git push
